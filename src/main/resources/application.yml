# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
  address: 0.0.0.0

# Spring Configuration
spring:
  application:
    name: smart-money
  
  
  # Database Configuration (PostgreSQL/Supabase)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartmoney}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # H2 Console (disabled for production)
  h2:
    console:
      enabled: false
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order-inserts: true
        order-updates: true
  
  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
  
  # Jackson Configuration
  jackson:
    date-format: dd/MM/yyyy
    time-zone: Asia/Ho_Chi_Minh
    serialization-inclusion: NON_NULL

  # Redis Configuration
  data:
    redis:
      url: ${REDIS_URI:redis://localhost:6379}
      timeout: 10000ms
        
  # Servlet Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Application Configuration
app:
  # JWT Configuration
  jwt:
    secret: ${SECRET_KEY:your-secret-key}
    access-token-expiration: 3600000    # 1 hour in milliseconds
    refresh-token-expiration: 604800000 # 7 days in milliseconds
    issuer: "smart-money-app"
    audience: "smart-money-users"
    token-prefix: "Bearer "
  
  # Public URLs. Real hostnames live only in the environment (.env / platform env vars,
  # both untracked) — the defaults below are localhost so a dev box works out of the box
  # and so no deployed hostname is committed to the repo. Every deployment MUST set
  # APP_BASE_URL / APP_WEB_URL / APP_FRONTEND_URL, otherwise links point at localhost.

  # Base URL of this API, used for deep-link invite generation
  base-url: ${APP_BASE_URL:http://localhost:8080}
  web-url: ${APP_WEB_URL:http://localhost:3000}

  # Frontend base URL used for CLI login and Device Flow activation links — this is the
  # redirect target the backend hands back to the CLI, so it must be the frontend host,
  # not the API host. No locale segment here — the code appends one (…/en/login?cli=…,
  # …/en/activate), so putting /en in this value would produce /en/en/login.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

  # Settlement engine (DEPRECATED by redesign Pivot B — press-to-contribute).
  # Disabled by default: the monthly settlement cron (MonthlySettlementScheduler) only
  # runs when enabled=true. Left as a reversible flag during the transition.
  settlement:
    enabled: ${SETTLEMENT_ENABLED:true}

  # Weekly insight digest (redesign Phase 2 P2-F). Disabled by default: the digest cron
  # (WeeklyInsightDigestScheduler) only runs when enabled=true. Keep off until the digest
  # path is validated against a live DB.
  digest:
    enabled: ${DIGEST_ENABLED:true}

  # Monthly recap (expansion Wave 3 item 6, MonthlyRecapScheduler): at month rollover, checks the
  # just-closed month for INCOME_DROP / CASHFLOW_NEGATIVE and pushes notification-only recap pings.
  # Disabled by default like the digest. The cron is overridable so a demo profile can fire it
  # every minute (e.g. RECAP_CRON="0 * * * * *"); default 09:00 on the 1st.
  recap:
    enabled: ${RECAP_ENABLED:true}
    cron: ${RECAP_CRON:0 0 9 1 * *}

  # Month-end savings sweep (expansion Wave 3 item 7, MonthEndSweepScheduler): a late-month
  # CONTRIBUTE_TO_PROJECT nudge decoupled from income arrival — reuses the existing savings
  # producer, so all fatigue controls apply. Disabled by default; default cron 09:00 on the 25th.
  sweep:
    enabled: ${SWEEP_ENABLED:true}
    cron: ${SWEEP_CRON:0 0 9 25 * *}

  # Weekly project-health pass (expansion Wave 4 item 8, ProjectHealthScheduler): checks every
  # active saving project's pace against its deadline and may raise an INCREASE_CONTRIBUTION
  # catch-up ask per off-track project. Weekly so a stalled project is caught quickly; the ask
  # itself is at most monthly per project (dedup key + cooldown). Disabled by default; default
  # cron 09:00 every Monday.
  project-health:
    enabled: ${PROJECT_HEALTH_ENABLED:true}
    cron: ${PROJECT_HEALTH_CRON:0 0 9 * * MON}

  # On-demand triggers for the scheduled flows (AdaptiveEngineDemoController,
  # POST /api/v1/demo/adaptive/recap|sweep|project-health?asOf=...). Testing/demo only — lets
  # Postman run the scheduled code paths deterministically for the authenticated user. Keep OFF
  # in production.
  demo-triggers:
    enabled: ${DEMO_TRIGGERS_ENABLED:true}

  # Budget-pace forecast method (redesign Phase 3 P3-B). LINEAR = the original naive
  # spent/day × daysInMonth projection (kept as the control). EXP_SMOOTHING = an exponentially
  # smoothed daily burn rate carried over the remaining days — steadier and far less sensitive to a
  # single early spike. Pure analyzer choice; defaults to LINEAR so live behaviour is unchanged.
  insight:
    forecast-method: ${INSIGHT_FORECAST_METHOD:LINEAR}
    # LLM narration (redesign Phase 3 P3-C). When on, insights/suggestions get a human sentence
    # (InsightResponse.narrative, push body) via Gemini; the LLM only phrases the pre-computed
    # facts, never a number. Best-effort: a model outage falls back to the i18n code. OFF by
    # default (network + cost + the live insight path is still unproven).
    narration:
      enabled: ${INSIGHT_NARRATION_ENABLED:true}

  # Suggestion fatigue ceiling (redesign Phase 3 P3-A). Layered on top of dedup (P1) and dismissal
  # suppression (P2-A): a per-user daily push cap and a per-topic cooldown (minimum hours between
  # pushes on the same topic). A CRITICAL escalation bypasses both. Tune down to nudge less.
  suggestion:
    daily-cap: ${SUGGESTION_DAILY_CAP:3}
    cooldown-hours: ${SUGGESTION_COOLDOWN_HOURS:24}

  # All-auto project tracking tunables (see docs/project-tracking-all-auto-plan.md §10)
  project:
    # Freeze + per-project debt cap = freeze-mult × monthly_saving
    freeze-mult: ${PROJECT_FREEZE_MULT:3}
    # Auto-unfreeze when money_owed <= unfreeze-mult × monthly_saving (0 = debt fully cleared)
    unfreeze-mult: ${PROJECT_UNFREEZE_MULT:0}
    # Consecutive frozen months with no recovery before the project EXPIRES
    max-frozen-months: ${PROJECT_MAX_FROZEN_MONTHS:3}
  
  # Google OAuth Configuration
  google:
    oauth2:
      enabled: true
      client-id: ${APP_GOOGLE_CLIENT_ID:}
      client-secret: ${APP_GOOGLE_CLIENT_SECRET:}

  # Facebook OAuth Configuration
  facebook:
    app-id: ${APP_FACEBOOK_APP_ID:}
    app-secret: ${APP_FACEBOOK_APP_SECRET:}
    token-validity-seconds: 3600

  # Supabase Configuration
  supabase:
    project-url: ${SUPABASE_PROJECT_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}      # REQUIRED - Get from Supabase Dashboard
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}  # OPTIONAL - Only for admin operations
    jwt-jwk: ${SUPABASE_JWT_JWK:}        # REQUIRED - ES256 public key in JWK format for token validation
    enabled: true

  # Email Configuration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:}

  # Gemini (Google AI) Configuration — used by the unrelated LlmPort / ProjectBudgetAdvisorUseCase
  # feature only. The chat endpoints (/api/v1/ai/**) use Claude, configured below.
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model-transactional: ${GEMINI_MODEL_TRANSACTIONAL:gemini-2.5-flash}
    model-general: ${GEMINI_MODEL_GENERAL:gemini-2.5-flash-lite}

  # Anthropic Claude Configuration — powers all /api/v1/ai/** chat endpoints.
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: ${CLAUDE_MODEL:claude-haiku-4-5}

  # Cloudinary Configuration
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
    api-key: ${CLOUDINARY_API_KEY:your_api_key}
    api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}
    folder: "smart-money/users"
    secure: true
  
  # Application Settings
  security:
    # Comma-separated. Deployed origins come from APP_ALLOWED_ORIGINS in the environment;
    # the default only covers local dev servers so no deployed host is committed here.
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:4200}
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"

# Logging Configuration
logging:
  level:
    com.example.smartmoney: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    io.lettuce.core: WARN
    org.springframework.data.redis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/smart-money.log

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    url: /v3/api-docs
    display-request-duration: true
    doc-expansion: none
    filter: true
    defaultModelsExpandDepth: 2
    defaultModelExpandDepth: 2
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match:
    - /api/v1/**
  group-configs:
  - group: authentication
    paths-to-match: /v1/auth/**
  - group: users
    paths-to-match: /v1/users/**
  - group: admin
    paths-to-match: /v1/admin/**