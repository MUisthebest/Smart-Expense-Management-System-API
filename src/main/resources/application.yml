# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# Spring Configuration
spring:
  application:
    name: smart-money
  
  
  # Database Configuration (PostgreSQL/Supabase)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartmoney}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # H2 Console (disabled for production)
  h2:
    console:
      enabled: false
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update  # Flyway manages schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order-inserts: true
        order-updates: true
  
  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  # Jackson Configuration
  jackson:
    date-format: dd/MM/yyyy
    time-zone: Asia/Ho_Chi_Minh
    serialization-inclusion: NON_NULL

  # Redis Configuration
  data:
    redis:
      url: ${REDIS_URI:redis://localhost:6379}
      timeout: 10000ms
        
  # Servlet Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Application Configuration
app:
  # JWT Configuration
  jwt:
    secret: "MySuperSecretKeyForJWTWithAtLeast256BitsLength1234567890ExtraSecureKeyForSmartMoney2024"
    access-token-expiration: 3600000    # 1 hour in milliseconds
    refresh-token-expiration: 604800000 # 7 days in milliseconds
    issuer: "smart-money-app"
    audience: "smart-money-users"
    token-prefix: "Bearer "
  
  # Google OAuth Configuration
  google:
    oauth2:
      enabled: true
      client-id: ${APP_GOOGLE_CLIENT_ID:}
      client-secret: ${APP_GOOGLE_CLIENT_SECRET:}

  # Facebook OAuth Configuration
  facebook:
    app-id: ${APP_FACEBOOK_APP_ID:}
    app-secret: ${APP_FACEBOOK_APP_SECRET:}
    token-validity-seconds: 3600

  # Supabase Configuration
  supabase:
    project-url: ${SUPABASE_PROJECT_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}      # REQUIRED - Get from Supabase Dashboard
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}  # OPTIONAL - Only for admin operations
    jwt-jwk: ${SUPABASE_JWT_JWK:}        # REQUIRED - ES256 public key in JWK format for token validation
    enabled: true

  # Email Configuration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:}

  # Cloudinary Configuration
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
    api-key: ${CLOUDINARY_API_KEY:your_api_key}
    api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}
    folder: "smart-money/users"
    secure: true
  
  # Application Settings
  security:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "http://localhost:4200"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"

# Logging Configuration
logging:
  level:
    com.example.smartmoney: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/smart-money.log

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    url: /api/v3/api-docs
    display-request-duration: true
    doc-expansion: none
    filter: true
    defaultModelsExpandDepth: 2
    defaultModelExpandDepth: 2
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match:
    - /api/v1/**
  group-configs:
  - group: authentication
    paths-to-match: /v1/auth/**
  - group: users
    paths-to-match: /v1/users/**
  - group: admin
    paths-to-match: /v1/admin/**