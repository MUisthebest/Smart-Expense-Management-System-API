<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: #fff;
      color: #000;
      margin: 0;
      padding: 0;
    }
    .email-container {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border: 2px solid #000;
      background: #fff;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
      text-transform: uppercase;
      border-bottom: 2px solid #000;
      padding-bottom: 10px;
    }
    .otp-container {
      text-align: center;
      font-size: 40px;
      font-weight: bold;
      letter-spacing: 8px;
      margin: 30px 0;
      border: 2px dashed #000;
      padding: 20px;
    }
    .expiry {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin-top: 40px;
      border-top: 1px solid #000;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="email-container">
    <h1>Email Verification</h1>
        
    <div class="otp-container">
      ${otp}
    </div>

    <p>Don't share otp code with anything else</p>
    
    <div class="expiry">
      ⏳ Code expires in <strong>${expiryMinutes} minutes</strong>
    </div>
    
    <div class="footer">
      © 2026 SmartMoney
    </div>
  </div>
</body>
</html>
